<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communes de Martinique - Découvrez la beauté des Antilles</title>
<!-- NOTE SEO : Le contenu des communes est généré dynamiquement en JS. Pour un meilleur référencement, voir SEO.md. -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="banniere-martinique">
<img src="img/banniere.jpg" alt="Plage en Martinique" class="banniere-img">
<h1 class="display-4 fw-bold">Communes de Martinique</h1>
</header>
<main class="container">
<input type="text" id="search-input" placeholder="Rechercher une commune..." autocomplete="off">
<button id="clear-search-btn" title="Effacer la recherche"><i class="fas fa-times"></i></button>
<button id="search-btn"><i class="fas fa-search"></i></button>
<button id="advanced-search-btn"><i class="fas fa-sliders-h"></i></button>
<div class="filters">
<button class="filter-btn" data-filter="all">Toutes</button>
</div>
<div id="map" style="position:relative;height:80vh;width:100%;min-height:500px;"></div>
</main>
<div class="modal fade" id="commune-modal" tabindex="-1">
<div class="modal-dialog"><div class="modal-content"><div class="modal-body" id="modal-body"></div></div></div>
</div>
<footer><p>&copy; 2025</p></footer>
<button id="theme-toggle" aria-label="Changer de thème"><i class="fas fa-moon"></i></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
