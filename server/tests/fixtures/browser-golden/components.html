<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Nexxus Components</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; margin: 0; padding: 32px; }
    .btn-primary { background: #6366f1; color: #fff; border-radius: 8px; padding: 10px 20px; box-shadow: 0 2px 8px rgba(99,102,241,0.35); }
    .btn-secondary { background: #e2e8f0; color: #0f172a; border-radius: 8px; padding: 10px 20px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 16px rgba(15,23,42,0.08); margin-bottom: 16px; }
    .badge-success { background: #10b981; color: #fff; border-radius: 999px; padding: 4px 12px; }
    .badge-warning { background: #f59e0b; color: #fff; border-radius: 999px; padding: 4px 12px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <span class="badge-success">Actif</span>
      <span class="badge-warning">Beta</span>
      <h1>Composants UI</h1>
      <button class="btn-primary">Action principale</button>
      <button class="btn-secondary">Secondaire</button>
    </section>
  </main>
</body>
</html>
