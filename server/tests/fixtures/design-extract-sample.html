<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Nexxus Demo — La Citadelle</title>
  <meta name="description" content="Plateforme souveraine de design et orchestration IA locale.">
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #6366f1;
      --surface: #f8fafc;
    }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 24px;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }
    .hero { margin-bottom: 32px; padding: 48px 24px; }
    .card { border-radius: 16px; padding: 16px; margin-bottom: 24px; }
    .btn-primary {
      background: #6366f1;
      color: #ffffff;
      border-radius: 8px;
      padding: 12px 24px;
    }
    .nav-container { display: grid; gap: 16px; }
  </style>
</head>
<body>
  <header class="nav-container"><nav>Menu</nav></header>
  <main>
    <section class="hero">
      <h1>La Citadelle</h1>
      <h2>Observer, transposer, corriger</h2>
    </section>
    <article class="card">
      <p>Design system local-first pour Nexxus Studio.</p>
      <a class="btn-primary cta" href="#forge">Découvrir Forge</a>
    </article>
  </main>
  <footer>© 2026 Nexxus Studio</footer>
</body>
</html>
