name: social-rail

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  social-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run deterministic social rail
        working-directory: server
        run: npm run test:social-rail
